<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyperion web link</title>
<!--
  Hyperion's sealed web link (M560). webread, webwrite, websave and mqttclient reach other sites from here: the Code
  window frames this page with sandbox="allow-scripts" and no allow-same-origin, so it runs in an opaque origin of its
  own, with nothing of the site's (no storage, cookies or sign-in), and every request goes without credentials. Its
  own policy (NET_CSP in security-headers.ts, also in public/_headers) lets it connect to https and wss addresses only;
  the page asks the person once for each new site before sending anything here (net-link.ts).
-->
</head>
<body>
<script>
'use strict';
const send = (m) => parent.postMessage(m, '*');
const MAX = 50 * 1024 * 1024;

async function web(m) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), Math.max(1000, Math.min(m.timeout || 15000, 120000)));
  try {
    const r = await fetch(m.url, { method: m.method || 'GET', headers: m.headers || {}, body: m.body ?? undefined, credentials: 'omit', redirect: 'follow', signal: ctl.signal, referrerPolicy: 'no-referrer' });
    const buf = new Uint8Array(await r.arrayBuffer());
    if (buf.length > MAX) throw new Error('the answer is bigger than 50 MB');
    send({ id: m.id, status: r.status, statusText: r.statusText, type: r.headers.get('content-type') || '', bytes: buf });
  } catch (e) {
    const why = e && e.name === 'AbortError' ? 'it took too long' : 'the site refused or couldn’t be reached (it may not allow other sites’ pages to read it)';
    send({ id: m.id, error: why });
  } finally { clearTimeout(t); }
}

// ——— MQTT 3.1.1 over a WebSocket: connect, subscribe and publish at QoS 0, a ping every 30 s ———
const enc = new TextEncoder(), dec = new TextDecoder();
const conns = new Map();
const lenBytes = (n) => { const o = []; do { let b = n % 128; n = Math.floor(n / 128); if (n > 0) b |= 128; o.push(b); } while (n > 0); return o; };
const strBytes = (s) => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
const packet = (head, body) => new Uint8Array([head, ...lenBytes(body.length), ...body]);
function mqttOpen(m) {
  let ws;
  try { ws = new WebSocket(m.url, ['mqtt']); } catch (e) { send({ id: m.id, error: 'that isn’t a broker address (it starts with wss://)' }); return; }
  ws.binaryType = 'arraybuffer';
  const c = { ws, buf: new Uint8Array(0), pid: 1, ping: 0, ready: false };
  conns.set(m.conn, c);
  const fail = setTimeout(() => { if (!c.ready) { send({ id: m.id, error: 'the broker didn’t answer' }); ws.close(); } }, 15000);
  ws.onopen = () => {
    let flags = 2; // clean session
    const body = [...strBytes('MQTT'), 4, 0, 0, 60, ...strBytes(m.clientId)];
    if (m.user) { flags |= 128; body.push(...strBytes(m.user)); }
    if (m.pass) { flags |= 64; body.push(...strBytes(m.pass)); }
    body[7] = flags;
    ws.send(packet(0x10, body));
  };
  ws.onmessage = (ev) => {
    const more = new Uint8Array(ev.data), all = new Uint8Array(c.buf.length + more.length);
    all.set(c.buf); all.set(more, c.buf.length); c.buf = all;
    for (;;) {
      let mul = 1, len = 0, i = 1, b;
      do { if (i >= c.buf.length) return; b = c.buf[i++]; len += (b & 127) * mul; mul *= 128; } while (b & 128);
      if (c.buf.length < i + len) return;
      const head = c.buf[0], body = c.buf.subarray(i, i + len);
      c.buf = c.buf.slice(i + len);
      const type = head >> 4;
      if (type === 2) {
        clearTimeout(fail);
        if (body[1] !== 0) { send({ id: m.id, error: ['', 'the broker doesn’t speak MQTT 3.1.1', 'the client name was refused', 'the broker is unavailable', 'the user name or password is wrong', 'not allowed'][body[1]] || 'refused' }); ws.close(); return; }
        c.ready = true; c.ping = setInterval(() => ws.send(new Uint8Array([0xc0, 0])), 30000);
        send({ id: m.id, ok: true });
      } else if (type === 3) {
        const tl = (body[0] << 8) | body[1], topic = dec.decode(body.subarray(2, 2 + tl));
        let p = 2 + tl;
        const qos = (head >> 1) & 3;
        if (qos > 0) { const id = [body[p], body[p + 1]]; p += 2; ws.send(new Uint8Array([0x40, 2, ...id])); }
        send({ mqtt: m.conn, topic, payload: body.slice(p), at: Date.now() });
      } else if (type === 9) {
        send({ mqtt: m.conn, subscribed: body[2] !== 0x80 });
      }
    }
  };
  ws.onclose = () => { clearInterval(c.ping); conns.delete(m.conn); send({ mqtt: m.conn, closed: true }); };
  ws.onerror = () => { if (!c.ready) { clearTimeout(fail); send({ id: m.id, error: 'the broker couldn’t be reached' }); } };
}
function mqttDo(m) {
  const c = conns.get(m.conn);
  if (!c || !c.ready) { send({ id: m.id, error: 'the broker link is closed' }); return; }
  if (m.op === 'subscribe') { const id = c.pid++ & 65535 || 1; c.ws.send(packet(0x82, [id >> 8, id & 255, ...strBytes(m.topic), 0])); }
  else if (m.op === 'unsubscribe') { const id = c.pid++ & 65535 || 1; c.ws.send(packet(0xa2, [id >> 8, id & 255, ...strBytes(m.topic)])); }
  else if (m.op === 'publish') c.ws.send(packet(m.retain ? 0x31 : 0x30, [...strBytes(m.topic), ...m.payload]));
  else if (m.op === 'close') { c.ws.send(new Uint8Array([0xe0, 0])); c.ws.close(); }
  send({ id: m.id, ok: true });
}

window.addEventListener('message', (ev) => {
  if (ev.source !== parent) return;
  const m = ev.data || {};
  if (m.kind === 'web') web(m);
  else if (m.kind === 'mqtt-open') mqttOpen(m);
  else if (m.kind === 'mqtt') mqttDo(m);
});
send({ ready: true });
</script>
</body>
</html>
