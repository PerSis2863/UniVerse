<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Hyperion</title>
<style>
  :root { color-scheme: light dark; --bg: #f1f2f4; --ink: #18181b; --soft: #52525b; --accent: #7c3aed; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0d; --ink: #f4f4f5; --soft: #a1a1aa; --accent: #a78bfa; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 26rem; text-align: center; padding: 2rem; }
  h1 { font-size: 1.25rem; margin: 1rem 0 .5rem; }
  p { color: var(--soft); margin: 0 0 1.25rem; }
  button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: .6rem; padding: .6rem 1.2rem; cursor: pointer; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: linear-gradient(135deg, #8b5cf6, #5b21b6); color: #fff; display: inline-grid; place-items: center; font-size: 30px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">Σ</div>
  <h1>Hyperion can’t reach the internet</h1>
  <p>Check the connection, then try again. Your scripts and files are kept on this computer.</p>
  <button type="button" id="again">Try again</button>
</main>
<script>
  const to = new URLSearchParams(location.search).get('to') || 'https://universeimpact.com/hyperion';
  document.getElementById('again').addEventListener('click', () => { location.href = to; });
  addEventListener('online', () => { location.href = to; });
</script>
</body>
</html>
